<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#063f32"><title>Estrellas SOGIMEX 2026</title><style>
:root{--green:#064737;--mint:#cbe8d8;--gold:#e8bc64;--cream:#fff9ed;--ink:#173d31}*{box-sizing:border-box}body{margin:0;font-family:system-ui,'Segoe UI',sans-serif;color:var(--ink);background:radial-gradient(circle at 10% 10%,#2b7159 0,transparent 35%),linear-gradient(140deg,#063b30,#092d28);min-height:100vh}body:before{content:'✦  ✧  ❄   ✦  ❄  ✧  ✦';position:fixed;top:15px;left:0;width:100%;text-align:center;color:#e8bc6480;letter-spacing:3vw;pointer-events:none}.shell{max-width:760px;margin:45px auto;padding:20px}.hero{text-align:center;color:white;margin-bottom:24px}.eyebrow{font-size:12px;letter-spacing:3px;text-transform:uppercase;color:var(--gold);font-weight:800}.hero h1{font-family:Georgia,serif;font-size:clamp(34px,7vw,58px);margin:10px 0;color:#fff8e5}.hero p{color:#d9e8dd;line-height:1.6}.card{background:var(--cream);border:1px solid #e8d9b7;border-radius:24px;padding:clamp(22px,5vw,42px);box-shadow:0 25px 80px #001b1570}.progress{display:flex;gap:7px;margin-bottom:24px}.progress span{height:7px;border-radius:10px;background:#d9ded4;flex:1}.progress span.on{background:var(--gold)}.step{color:#9b7a36;font-weight:800;font-size:12px;text-transform:uppercase;letter-spacing:2px}h2{font-family:Georgia,serif;font-size:clamp(26px,5vw,38px);margin:10px 0}p{line-height:1.6}.quote{background:#eef3e9;padding:16px 18px;border-left:4px solid #c8a25a;border-radius:8px;margin:20px 0}.field{margin-top:24px}label{font-weight:750;display:block;margin-bottom:9px}input{width:100%;padding:16px;border:2px solid #cad7cd;border-radius:12px;font-size:17px;background:white;color:#183d31}input:focus{outline:3px solid #e8bc6470;border-color:#b48b3f}.hint{font-size:13px;color:#5c7065;margin-top:8px}.actions{display:flex;gap:12px;margin-top:28px}.btn{border:0;border-radius:12px;padding:16px 24px;font-weight:800;font-size:16px;cursor:pointer;flex:1}.primary{background:var(--green);color:white}.primary:hover{background:#09674d}.secondary{background:#e5ebe3;color:var(--ink);flex:0 0 auto}.badge{font-size:48px;margin-bottom:8px}.summary{padding:0;list-style:none}.summary li{padding:12px 0;border-bottom:1px solid #dbe3d7}.summary strong{display:block}.check{display:flex;align-items:flex-start;gap:10px;margin-top:18px;font-size:14px}.check input{width:auto;margin-top:4px}.error{color:#a02c29;font-weight:700;margin-top:12px}.success{text-align:center}.foot{text-align:center;color:#c2d9cd;font-size:12px;margin:24px 0}.hidden{display:none}.snow{position:fixed;inset:0;pointer-events:none;overflow:hidden}.snow i{position:absolute;top:-30px;color:#ffffff6b;font-style:normal;animation:fall linear infinite}@keyframes fall{to{transform:translateY(110vh) rotate(180deg)}}@media(max-width:520px){.shell{margin:15px auto;padding:12px}.card{border-radius:19px}.actions{flex-wrap:wrap}.btn{width:100%}}
</style></head><body><div class="snow" aria-hidden="true" id="snow"></div><main class="shell"><header class="hero"><div class="eyebrow">✦ Navidad · Reconocimiento · Valores ECOM ✦</div><h1>Estrellas SOGIMEX <span style="color:var(--gold)">2026</span></h1><p>Hay compañeros que hacen brillar nuestros días.<br>Esta Navidad, ¡reconozcamos su talento! ☕🎄</p></header><section class="card" aria-live="polite"><div class="progress" id="progress"></div><div id="content"></div></section><footer class="foot">SOGIMEX · Celebramos lo mejor de nuestro equipo · 2026</footer></main><script>
// Pegue aquí la URL de implementación de Google Apps Script terminada en /exec.
const SCRIPT_URL = 'PEGAR_AQUI_URL_DE_APPS_SCRIPT';
const values=[{title:'Innovación',icon:'💡',tag:'Quien se atreve a pensar diferente',definition:'Somos valientes y audaces. Desafiamos el statu quo.'},{title:'Integridad',icon:'🤝',tag:'Quien inspira confianza',definition:'Actuamos de buena fe. Asumimos nuestra responsabilidad y respondemos de nuestros actos.'},{title:'Inclusividad',icon:'💚',tag:'Quien hace sentir parte del equipo',definition:'Promovemos la pertenencia. Nos respetamos y valoramos.'},{title:'Colaboración',icon:'🫶',tag:'Quien siempre tiende la mano',definition:'Combinamos nuestra fuerza colectiva. Trabajamos juntos para conseguir más.'},{title:'Excelencia',icon:'⭐',tag:'Quien nos inspira a ser mejores',definition:'Nos adaptamos. Seguimos mejorando y esforzándonos por ser mejores que ayer.'}];
const state={step:0,participant:'',nominations:['','','','',''],consent:false};const content=document.getElementById('content'),progress=document.getElementById('progress');const clean=s=>s.trim().replace(/\s+/g,' ');const escapeHtml=s=>s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function error(t){document.getElementById('error').textContent=t}function render(){progress.innerHTML=Array.from({length:7},(_,i)=>`<span class="${i<=state.step?'on':''}"></span>`).join('');if(state.step===0){content.innerHTML=`<div class="badge">🎁</div><div class="step">Comencemos</div><h2>Tu reconocimiento cuenta</h2><p>Escribe tu nombre completo para comenzar a nominar a los compañeros que mejor representan nuestros cinco valores.</p><div class="field"><label for="answer">Tu nombre y apellido</label><input id="answer" maxlength="100" autocomplete="name" placeholder="Ej. María López" value="${escapeHtml(state.participant)}"><div class="hint">Usaremos tu nombre únicamente para registrar tu participación.</div></div><div id="error" class="error" role="alert"></div><div class="actions"><button class="btn primary" id="next">¡Comenzar! ✨</button></div>`}else if(state.step<=5){let v=values[state.step-1];content.innerHTML=`<div class="badge">${v.icon}</div><div class="step">Valor ${state.step} de 5</div><h2>${v.title}</h2><p><strong>${v.tag}</strong></p><div class="quote">“${v.definition}”</div><div class="field"><label for="answer">¿Qué compañero representa mejor este valor?</label><input id="answer" maxlength="100" placeholder="Nombre y apellido de tu compañero" value="${escapeHtml(state.nominations[state.step-1])}"><div class="hint">Escribe el nombre completo para facilitar el reconocimiento.</div></div><div id="error" class="error" role="alert"></div><div class="actions"><button class="btn secondary" id="back">Atrás</button><button class="btn primary" id="next">${state.step===5?'Revisar nominaciones':'Siguiente valor →'}</button></div>`}else if(state.step===6){content.innerHTML=`<div class="badge">🏆</div><div class="step">Último paso</div><h2>Revisa tus estrellas</h2><p>Participante: <strong>${escapeHtml(state.participant)}</strong></p><ul class="summary">${values.map((v,i)=>`<li><strong>${v.icon} ${v.title}</strong>${escapeHtml(state.nominations[i])}</li>`).join('')}</ul><label class="check"><input type="checkbox" id="consent" ${state.consent?'checked':''}><span>Confirmo que estas nominaciones representan mi elección y autorizo su registro para esta actividad interna.</span></label><div id="error" class="error" role="alert"></div><div class="actions"><button class="btn secondary" id="back">Editar</button><button class="btn primary" id="send">Enviar mis nominaciones 🎄</button></div>`}else{content.innerHTML=`<div class="success"><div class="badge">🎉</div><h2>¡Gracias por hacer brillar a SOGIMEX!</h2><p>Tus cinco nominaciones quedaron registradas. Que esta Navidad nos recuerde la fuerza de reconocer lo mejor de los demás.</p><div class="quote">🎄 ¡Felices fiestas y un excelente 2027! ☕</div></div>`}document.getElementById('next')?.addEventListener('click',next);document.getElementById('back')?.addEventListener('click',()=>{state.step--;render()});document.getElementById('send')?.addEventListener('click',send);document.getElementById('consent')?.addEventListener('change',e=>state.consent=e.target.checked);document.getElementById('answer')?.addEventListener('keydown',e=>{if(e.key==='Enter')next()})}function next(){const input=document.getElementById('answer');let val=clean(input.value);if(val.length<5||!val.includes(' ')){error('Escribe nombre y apellido completos para continuar.');return}if(state.step===0){state.participant=val}else{if(val.toLocaleLowerCase('es')===state.participant.toLocaleLowerCase('es')){error('No puedes nominarte a ti mismo.');return}state.nominations[state.step-1]=val}state.step++;render()}
async function send(){if(!state.consent){error('Debes confirmar tus nominaciones antes de enviarlas.');return}if(!SCRIPT_URL.startsWith('https://script.google.com/macros/s/')){error('El administrador aún debe conectar el formulario con Google Sheets.');return}const btn=document.getElementById('send');btn.disabled=true;btn.textContent='Guardando nominaciones…';try{const payload={participant:state.participant,nominations:state.nominations,consent:true};const res=await fetch(SCRIPT_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(payload),redirect:'follow'});const data=await res.json();if(!data.ok)throw new Error(data.message||'No fue posible guardar la respuesta.');state.step=7;render()}catch(e){error(e.message==='Failed to fetch'?'No se pudo conectar con el registro. Revisa el despliegue de Apps Script y sus permisos.':e.message);btn.disabled=false;btn.textContent='Reintentar envío 🎄'}}for(let i=0;i<18;i++){let el=document.createElement('i');el.textContent=i%3?'✦':'❄';el.style.left=(i*37%100)+'%';el.style.animationDuration=(8+i%8)+'s';el.style.animationDelay=-(i%13)+'s';document.getElementById('snow').appendChild(el)}render();
</script></body></html>
